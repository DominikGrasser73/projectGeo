<div class="flex flex-row">
  <app-sidebar [user]="user"></app-sidebar>
</div>

@if(state.state === 'login'){
<div class="app-login">
  <app-login (loginEvent)="loginChange($event)" (userEvent)="userChange($event)"></app-login>
</div>

} @else if (state.state === 'eliciting' || state.state === 'activity') {
<div class="map-container">
  <app-leaflet-map [user]="user" [state]="state"></app-leaflet-map>
</div>
<app-goalification-dialog [user]="user" />
}
